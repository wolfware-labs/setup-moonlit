name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  major-tag:
    name: move the major tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Prove the action works at this exact commit before the floating
      # major tag is force-moved to it. ci.yml's unfiltered `on: push:` runs
      # concurrently with this workflow on the same tag push, so it cannot
      # be relied on to gate the tag move — this smoke test has to do it
      # inline, in this same job, so there is no cross-job race.
      - name: Smoke test the action at this tag
        id: smoke
        uses: ./
        with:
          version: latest

      - name: The action works before the major tag is moved
        shell: bash
        env:
          VERSION: ${{ steps.smoke.outputs.version }}
        run: |
          set -euo pipefail

          moonlit --version

          if [[ -z "$VERSION" ]]; then
            echo "::error::setup-moonlit: smoke test produced an empty 'version' output; refusing to move the major tag."
            exit 1
          fi

      - name: Point vN at this release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::unexpected tag '${TAG}'"
            exit 1
          fi
          major="v${BASH_REMATCH[1]}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "$TAG"
          git push -f origin "refs/tags/${major}"

          echo "setup-moonlit: ${major} now points at ${TAG}"
