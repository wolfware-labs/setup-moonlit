name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: install ${{ matrix.version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: [latest, '1.2.0']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - id: setup
        uses: ./
        with:
          version: ${{ matrix.version }}

      - name: The CLI runs and reports the requested version
        shell: bash
        env:
          REQUESTED: ${{ matrix.version }}
          REPORTED: ${{ steps.setup.outputs.version }}
          BIN_DIR: ${{ steps.setup.outputs.bin-dir }}
        run: |
          set -euo pipefail

          got="$(moonlit --version)"
          echo "moonlit --version => $got"
          [[ "$got" == "moonlit "* ]]

          if [[ "$REQUESTED" != "latest" ]]; then
            [[ "$got" == "moonlit ${REQUESTED}" ]]
            [[ "$REPORTED" == "$REQUESTED" ]]
          else
            # The pinned "1.2.0" arm above is an immutable published release,
            # so it can never catch a future `moonlit --version` format
            # change (e.g. clap's long_version growing a build SHA suffix).
            # The "latest" arm tracks whatever the CLI ships today, so make
            # it assert the exact shape setup-moonlit's parser depends on:
            # this repo goes red on a format change instead of a consumer.
            if [[ ! "$got" =~ ^moonlit\ [0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "'moonlit --version' output no longer matches the expected 'moonlit X.Y.Z' shape: $got"
              exit 1
            fi
          fi

          [[ -n "$REPORTED" ]]
          [[ -n "$BIN_DIR" ]]

      - name: PATH resolves moonlit from the action's install directory
        shell: bash
        run: |
          set -euo pipefail
          resolved="$(command -v moonlit)"
          echo "command -v moonlit => $resolved"
          case "$resolved" in
            *moonlit/bin/moonlit*) ;;
            *) echo "moonlit did not resolve from the action's install dir"; exit 1 ;;
          esac

      - name: The binary executes real subcommands
        shell: bash
        run: |
          set -euo pipefail
          moonlit --help > /dev/null
          moonlit cache ls

  reject-bad-version:
    name: reject ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: shell injection
            bad: '; rm -rf /'
            stage: resolve
          - label: not a version
            bad: 'not-a-version'
            stage: resolve
          - label: newline smuggling
            bad: "latest\nhttp://evil.example"
            stage: resolve
          - label: nonexistent release
            bad: '9.9.9-nope'
            stage: install
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - id: bad
        continue-on-error: true
        uses: ./
        with:
          version: ${{ matrix.bad }}

      - name: The action must have failed
        shell: bash
        env:
          OUTCOME: ${{ steps.bad.outcome }}
          STAGE: ${{ matrix.stage }}
          BIN_DIR: ${{ steps.bad.outputs.bin-dir }}
        run: |
          set -euo pipefail

          if [[ "$OUTCOME" != "failure" ]]; then
            echo "setup-moonlit accepted a version input it should have rejected"
            exit 1
          fi

          case "$STAGE" in
            resolve)
              if [[ -n "$BIN_DIR" ]]; then
                echo "expected no bin-dir output when rejected by the resolve step (pattern), got: $BIN_DIR"
                exit 1
              fi
              ;;
            install)
              if [[ -z "$BIN_DIR" ]]; then
                echo "expected a bin-dir output when rejected by the install step (resolve should have completed), got empty"
                exit 1
              fi
              ;;
            *)
              echo "unknown stage: $STAGE"
              exit 1
              ;;
          esac

  cache-prime:
    name: cache — prime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - id: setup
        uses: ./
        with:
          cache-dependency-path: action.yml

      - name: Put a marker in the plugin cache directory
        shell: bash
        env:
          CACHE_DIR: ${{ steps.setup.outputs.cache-dir }}
        run: |
          set -euo pipefail
          mkdir -p "$CACHE_DIR"
          echo primed > "$CACHE_DIR/marker"

  cache-hit:
    name: cache — hit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: cache-prime
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - id: setup
        uses: ./
        with:
          cache-dependency-path: action.yml

      - name: The cache restored on an exact key match
        shell: bash
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
          CACHE_DIR: ${{ steps.setup.outputs.cache-dir }}
        run: |
          set -euo pipefail
          echo "cache-hit => ${CACHE_HIT}"
          [[ "$CACHE_HIT" == "true" ]]
          [[ "$(cat "$CACHE_DIR/marker")" == "primed" ]]

  cache-disabled:
    name: cache — disabled and keyless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - id: off
        uses: ./
        with:
          cache: 'false'
          cache-dependency-path: action.yml

      - name: Nothing was restored when caching is off
        shell: bash
        env:
          CACHE_HIT: ${{ steps.off.outputs.cache-hit }}
        run: |
          set -euo pipefail
          [[ -z "$CACHE_HIT" ]]

      - name: A config path that matches nothing still installs cleanly
        id: nohash
        uses: ./
        with:
          cache-dependency-path: 'no-such-config.yml'

      - name: The action succeeded and skipped the cache
        shell: bash
        env:
          CACHE_HIT: ${{ steps.nohash.outputs.cache-hit }}
          VERSION: ${{ steps.nohash.outputs.version }}
        run: |
          set -euo pipefail
          [[ -z "$CACHE_HIT" ]]
          [[ -n "$VERSION" ]]
