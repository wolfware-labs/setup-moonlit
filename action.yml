name: Setup Moonlit
description: Install the Moonlit CLI and put it on PATH
author: Wolfware LLC

branding:
  icon: moon
  color: gray-dark

inputs:
  version:
    description: 'Moonlit version to install: "latest" or an exact version such as "1.2.0".'
    required: false
    default: latest
  cache:
    description: 'Cache the Moonlit plugin content directory between runs.'
    required: false
    default: 'true'
  cache-dependency-path:
    description: 'Glob whose matched files key the plugin cache.'
    required: false
    default: 'release.y*ml'

outputs:
  version:
    description: 'The version actually installed, read back from `moonlit --version`.'
    value: ${{ steps.verify.outputs.version }}
  bin-dir:
    description: 'The directory added to PATH.'
    value: ${{ steps.resolve.outputs.bin-dir }}
  cache-hit:
    description: '"true" when the plugin cache restored on an exact key match.'
    value: ${{ steps.cache.outputs.cache-hit }}
  cache-dir:
    description: 'The resolved plugin cache directory for this runner OS.'
    value: ${{ steps.resolve.outputs.cache-dir }}

runs:
  using: composite
  steps:
    - name: Resolve version and paths
      id: resolve
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_CACHE: ${{ inputs.cache }}
        INPUT_CACHE_PATH: ${{ inputs.cache-dependency-path }}
        CONFIG_HASH: ${{ hashFiles(inputs.cache-dependency-path) }}
      run: |
        set -euo pipefail

        # Bash's =~ anchors against the whole string. grep would match line by
        # line, so a value carrying a newline would slip past an anchored
        # pattern with a benign first line.
        if [[ ! "$INPUT_VERSION" =~ ^(latest|v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
          echo "::error::setup-moonlit: invalid 'version' input. Use 'latest' or an exact version such as '1.2.0'."
          exit 1
        fi

        if [[ "$INPUT_VERSION" == "latest" ]]; then
          base="https://github.com/wolfware-labs/moonlit/releases/latest/download"
          expected=""
        else
          exact="${INPUT_VERSION#v}"
          base="https://github.com/wolfware-labs/moonlit/releases/download/moonlit-v${exact}"
          expected="$exact"
        fi

        case "$RUNNER_OS" in
          Linux)   cache_dir="${XDG_CACHE_HOME:-$HOME/.cache}/moonlit" ;;
          macOS)   cache_dir="$HOME/Library/Caches/moonlit" ;;
          Windows) cache_dir="${LOCALAPPDATA:?setup-moonlit: LOCALAPPDATA is unset}\\moonlit" ;;
          *)
            echo "::error::setup-moonlit: unsupported runner OS '${RUNNER_OS}'. Supported: Linux, macOS, Windows."
            exit 1
            ;;
        esac

        install_dir="${RUNNER_TEMP}/moonlit"

        cache_key=""
        if [[ "$INPUT_CACHE" == "true" ]]; then
          if [[ -n "$CONFIG_HASH" ]]; then
            cache_key="moonlit-plugins-${RUNNER_OS}-${CONFIG_HASH}"
          else
            echo "setup-moonlit: no files matched '${INPUT_CACHE_PATH}', so the plugin cache is skipped. Place setup-moonlit after actions/checkout, or set cache-dependency-path."
          fi
        elif [[ "$INPUT_CACHE" != "false" ]]; then
          echo "setup-moonlit: 'cache' input is '${INPUT_CACHE}', which is neither 'true' nor 'false'; treating it as disabled and skipping the plugin cache."
        fi

        {
          echo "base=${base}"
          echo "expected=${expected}"
          echo "install-dir=${install_dir}"
          echo "bin-dir=${install_dir}/bin"
          echo "cache-dir=${cache_dir}"
          echo "cache-key=${cache_key}"
        } >> "$GITHUB_OUTPUT"

    - name: Restore the plugin cache
      id: cache
      if: steps.resolve.outputs.cache-key != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.resolve.outputs.cache-dir }}
        key: ${{ steps.resolve.outputs.cache-key }}
        restore-keys: moonlit-plugins-${{ runner.os }}-

    - name: Install (Linux, macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        BASE: ${{ steps.resolve.outputs.base }}
        MOONLIT_INSTALL_DIR: ${{ steps.resolve.outputs.install-dir }}
        MOONLIT_NO_MODIFY_PATH: '1'
      run: |
        set -euo pipefail
        curl --proto '=https' --proto-redir '=https' --tlsv1.2 -LsSf "${BASE}/moonlit-installer.sh" | sh

    - name: Install (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        BASE: ${{ steps.resolve.outputs.base }}
        INSTALL_DIR: ${{ steps.resolve.outputs.install-dir }}
        MOONLIT_NO_MODIFY_PATH: '1'
      run: |
        $ErrorActionPreference = 'Stop'
        $env:MOONLIT_INSTALL_DIR = $env:INSTALL_DIR.Replace('/', '\')
        Invoke-RestMethod "$env:BASE/moonlit-installer.ps1" | Invoke-Expression

    - name: Add to PATH and verify
      id: verify
      shell: bash
      env:
        BIN_DIR: ${{ steps.resolve.outputs.bin-dir }}
        EXPECTED: ${{ steps.resolve.outputs.expected }}
      run: |
        set -euo pipefail

        echo "$BIN_DIR" >> "$GITHUB_PATH"

        if [[ "$RUNNER_OS" == "Windows" ]]; then
          exe="${BIN_DIR}/moonlit.exe"
        else
          exe="${BIN_DIR}/moonlit"
        fi

        raw="$("$exe" --version)"

        # Extract a semver from anywhere in the output rather than assuming
        # it is the last space-delimited token: a build metadata suffix such
        # as "(abc123)" would otherwise silently become the "installed"
        # value.
        if [[ ! "$raw" =~ ([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?) ]]; then
          echo "::error::setup-moonlit: could not parse a version from 'moonlit --version' output: ${raw}"
          exit 1
        fi
        installed="${BASH_REMATCH[1]}"

        if [[ -n "$EXPECTED" && "$installed" != "$EXPECTED" ]]; then
          echo "::error::setup-moonlit: requested moonlit ${EXPECTED} but ${installed} was installed."
          exit 1
        fi

        echo "version=${installed}" >> "$GITHUB_OUTPUT"
        echo "setup-moonlit: installed moonlit ${installed} at ${BIN_DIR}"
